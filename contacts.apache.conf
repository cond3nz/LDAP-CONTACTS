<VirtualHost *:443>
    ServerAdmin admin@example.com
    ServerName contacts.example.com
    DocumentRoot /var/www/contacts

    <Directory /var/www/contacts>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        SetEnv srv DC1
        SetEnv srv_domain corp.example.com
        SetEnv srv_login contacts@corp.example.com
        SetEnv srv_password secretpasswd
        SetEnv dn "OU=Some ORG,OU=Users,DC=corp,DC=example,DC=com"
        SetEnv companyname "Some ORG"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/contacts_error.someorg.log
    CustomLog ${APACHE_LOG_DIR}/contacts_access.someorg.log combined

    SSLEngine on
    SSLCertificateFile /etc/certs/tainv.ru/contacts.example.com.crt
    SSLCertificateKeyFile /etc/certs/tainv.ru/contacts.example.com.key

</VirtualHost>